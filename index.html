<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天機卜卦</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: #0f0000;
            color: #ffccaa;
            font-family: 'Noto Serif SC', serif;
            text-align: center;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(#4a0000, #1a0000);
            padding: 25px;
            border-bottom: 5px solid #8b0000;
            box-shadow: 0 4px 15px rgba(139, 0, 0, 0.8);
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3em;
            margin: 0;
            letter-spacing: 8px;
            text-shadow: 4px 4px 0 #000;
        }

        .subtitle {
            font-size: 1.2em;
            margin-top: 10px;
            opacity: 0.75;
            letter-spacing: 3px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        /* Esoteric Question Area */
        .oracle-area {
            background: #1f0000;
            border: 4px solid #8b0000;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 35px;
            box-shadow: 0 0 25px rgba(139, 0, 0, 0.6);
        }

        .oracle-title {
            font-size: 1.8em;
            color: #ffdd99;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #ffaa00;
            letter-spacing: 4px;
        }

        textarea {
            width: 100%;
            max-width: 680px;
            height: 110px;
            background: #0a0000;
            border: 3px solid #660000;
            color: #ffddaa;
            font-family: 'Noto Serif SC', serif;
            font-size: 1.2em;
            padding: 15px;
            resize: vertical;
        }

        .log {
            margin-top: 20px;
            text-align: left;
            max-height: 180px;
            overflow-y: auto;
            background: #140000;
            padding: 12px;
            border: 2px solid #440000;
            font-size: 0.95em;
        }

        /* Coin Area */
        .coin-area {
            background: #2a0000;
            border: 3px solid #8b0000;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .coins {
            display: flex;
            justify-content: center;
            gap: 45px;
            margin: 25px 0;
        }

        .coin {
            width: 92px;
            height: 92px;
            background: radial-gradient(circle at 40% 30%, #ffd700, #b8860b);
            border-radius: 50%;
            border: 7px solid #8b4513;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            font-weight: bold;
            color: #4a0000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8),
                        inset 0 -12px 18px rgba(255,255,255,0.25);
            transition: transform 0.6s;
            cursor: pointer;
        }

        .coin.flipping {
            animation: flipCoin 0.85s ease;
        }

        @keyframes flipCoin {
            0% { transform: rotateY(0deg) rotateX(0deg); }
            100% { transform: rotateY(1800deg) rotateX(1200deg); }
        }

        button {
            background: #8b0000;
            color: #ffddaa;
            border: 3px solid #ffccaa;
            padding: 14px 34px;
            font-size: 1.35em;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            margin: 8px;
            box-shadow: 0 5px 0 #4a0000;
            transition: all 0.2s;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #4a0000;
        }

        .hexagram-container {
            background: #1a0000;
            border: 4px solid #8b0000;
            padding: 30px;
            margin: 30px auto;
            max-width: 620px;
            min-height: 520px;
        }

        svg {
            background: #0a0000;
            border: 2px solid #550000;
        }

        .result {
            margin-top: 30px;
            font-size: 1.65em;
            line-height: 1.4;
            min-height: 90px;
        }

        .info {
            text-align: left;
            background: #220000;
            padding: 20px;
            border: 2px solid #8b0000;
            margin-top: 25px;
            font-size: 1.05em;
        }
    </style>
</head>
<body>
    <header>
        <h1>天機</h1>
        <p class="subtitle">古易 · 幽冥問卜</p>
    </header>

    <div class="container">
        <!-- Esoteric Question Input -->
        <div class="oracle-area">
            <div class="oracle-title">叩問天機</div>
            <p style="margin-bottom:12px; opacity:0.85;">默念心事，寫下你的疑惑</p>
            <textarea id="question" placeholder="天地悠悠，吾心所向..."></textarea>
            <button onclick="saveQuestion()">記入冥錄</button>
            <button onclick="downloadLog()" style="background:#440000;">下載卜錄</button>

            <div class="log" id="log"></div>
        </div>

        <div class="coin-area">
            <h2>三錢定卦</h2>
            <div class="coins" id="coins">
                <div class="coin" id="coin1">⚪</div>
                <div class="coin" id="coin2">⚪</div>
                <div class="coin" id="coin3">⚪</div>
            </div>
            <button onclick="castLine()">投擲銅錢 (第 <span id="current-line">1</span>/6 爻)</button>
            <button onclick="castFullHexagram()">一卦而畢</button>
            <button onclick="resetDivination()" style="background:#440000;">重開卜局</button>
        </div>

        <div class="hexagram-container">
            <svg id="hexagram-svg" width="580" height="480"></svg>
            <div class="result" id="result"></div>
        </div>

        <div class="info" id="info">
            <strong>幽冥之理：</strong> 由下而上起爻。<br>
            陽 ●　陰 – –　　老陽 9　老陰 6
        </div>
    </div>

    <script>
        // ==================== ORIGINAL I CHING DATA ====================
        var trigram = ['☰','☳','☵','☶','☷','☴','☲','☱'];
        var hexagrams = ['䷀','䷡','䷄','䷙','䷊','䷈','䷍','䷪','䷘','䷲','䷂','䷚','䷗','䷩','䷔','䷐','䷅','䷧','䷜','䷃','䷆','䷺','䷿','䷮','䷠','䷽','䷦','䷳','䷎','䷴','䷷','䷞','䷋','䷏','䷇','䷖','䷁','䷓','䷢','䷬','䷫','䷟','䷯','䷑','䷭','䷸','䷱','䷛','䷌','䷶','䷾','䷕','䷣','䷤','䷝','䷰','䷉','䷵','䷻','䷨','䷒','䷼','䷥','䷹'];
        var hexagram_name = ['乾','大壯','需','大畜','泰','小畜','大有','夬','無妄','震','屯','頤','復','益','噬嗑','隨','訟','解','坎','蒙','師','渙','未濟','困','遯','小過','蹇','艮','謙','漸','旅','咸','否','豫','比','剝','坤','觀','晉','萃','姤','恆','井','蠱','升','巽','鼎','大過','同人','豐','既濟','賁','明夷','家人','離','革','履','歸妹','節','損','臨','中孚','睽','兌'];

        let lines = [];
        let divinationLog = JSON.parse(localStorage.getItem('divinationLog')) || [];

        function updateLogDisplay() {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML = '<strong>冥錄：</strong><br>';
            if (divinationLog.length === 0) {
                logDiv.innerHTML += '尚無卜錄...';
                return;
            }
            divinationLog.slice(-5).reverse().forEach(entry => {
                logDiv.innerHTML += `<small>${entry.time} — ${entry.question.substring(0, 45)}${entry.question.length > 45 ? '...' : ''}</small><br>`;
            });
        }

        function saveQuestion() {
            const q = document.getElementById('question').value.trim();
            if (!q) return;

            const entry = {
                time: new Date().toLocaleString('zh-TW'),
                question: q
            };
            divinationLog.push(entry);
            localStorage.setItem('divinationLog', JSON.stringify(divinationLog));
            updateLogDisplay();
            document.getElementById('question').value = '';
        }

        function downloadLog() {
            if (divinationLog.length === 0) return alert("尚無卜錄可下載");

            let text = "天機卜錄\n==================\n\n";
            divinationLog.forEach((entry, i) => {
                text += `${i+1}. ${entry.time}\n問：${entry.question}\n\n`;
            });

            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '天機卜錄.txt';
            a.click();
        }

        // Coin & Hexagram functions (same as before, slightly refined)
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function flipCoin(coinEl) {
            coinEl.classList.add('flipping');
            setTimeout(() => {
                const isHeads = Math.random() > 0.5;
                coinEl.textContent = isHeads ? '⚪' : '●';
                coinEl.style.background = isHeads ?
                    'radial-gradient(circle at 40% 30%, #ffd700, #b8860b)' :
                    'radial-gradient(circle at 40% 30%, #444, #111)';
                coinEl.classList.remove('flipping');
            }, 650);
        }

        function castLine() {
            if (lines.length >= 6) return;

            const coins = [document.getElementById('coin1'), document.getElementById('coin2'), document.getElementById('coin3')];
            coins.forEach(coin => flipCoin(coin));

            setTimeout(() => {
                let total = 0;
                for (let i = 0; i < 3; i++) {
                    total += Math.random() > 0.5 ? 3 : 2;
                }
                const isYang = (total === 7 || total === 9);
                lines.push({value: total, isYang: isYang});

                renderHexagram();
                document.getElementById('current-line').textContent = lines.length + 1;
            }, 850);
        }

        function castFullHexagram() {
            lines = [];
            for (let i = 0; i < 6; i++) {
                let total = 0;
                for (let j = 0; j < 3; j++) {
                    total += Math.random() > 0.5 ? 3 : 2;
                }
                lines.push({value: total, isYang: (total === 7 || total === 9)});
            }
            renderHexagram();
            document.getElementById('current-line').textContent = '1';
        }

        function resetDivination() {
            lines = [];
            document.getElementById('result').innerHTML = '';
            d3.select("#hexagram-svg").selectAll("*").remove();
            document.getElementById('current-line').textContent = '1';
        }

        function getHexagramFromLines() {
            if (lines.length !== 6) return null;
            let binary = '';
            for (let i = 0; i < 6; i++) {
                binary += lines[i].isYang ? '1' : '0';
            }
            const lower = parseInt(binary.substring(3,6).split('').reverse().join(''), 2);
            const upper = parseInt(binary.substring(0,3).split('').reverse().join(''), 2);
            const hexIndex = lower * 8 + upper;
            return { hex: hexagrams[hexIndex], name: hexagram_name[hexIndex], index: hexIndex };
        }

        function drawYangYao(svg, x, y, width, height) {
            svg.append("rect").attr("x", x).attr("y", y).attr("width", width).attr("height", height).attr("fill", "#ffddaa");
        }

        function drawYinYao(svg, x, y, width, height) {
            const gap = height * 0.75;
            svg.append("rect").attr("x", x).attr("y", y).attr("width", (width-gap)/2).attr("height", height).attr("fill", "#ffddaa");
            svg.append("rect").attr("x", x + (width+gap)/2).attr("y", y).attr("width", (width-gap)/2).attr("height", height).attr("fill", "#ffddaa");
        }

        function renderHexagram() {
            const svg = d3.select("#hexagram-svg");
            svg.selectAll("*").remove();

            const x = 180;
            const width = 220;
            const height = 28;
            const interval = 52;

            for (let i = 0; i < lines.length; i++) {
                const y = 380 - (i * interval);
                if (lines[i].isYang) {
                    drawYangYao(svg, x, y, width, height);
                } else {
                    drawYinYao(svg, x, y, width, height);
                }
            }

            if (lines.length === 6) {
                const result = getHexagramFromLines();
                document.getElementById('result').innerHTML = `
                    <strong>${result.hex}　${result.name}</strong><br>
                    <small>第 ${result.index + 1} 卦　　天機已顯</small>
                `;
            }
        }

        // Init
        window.onload = function() {
            updateLogDisplay();
            document.getElementById('result').innerHTML = `<em style="opacity:0.7">默念心事，投擲銅錢...</em>`;
        };
    </script>
</body>
</html>
